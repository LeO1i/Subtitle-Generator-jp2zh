[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "japanese-subtitle"
version = "2.0.0"
description = "Generate bilingual Japanese and Traditional Chinese subtitles from video"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.1",
    "transformers>=4.40",
    "accelerate>=0.28",
    "tokenizers>=0.15",
    "safetensors>=0.4",
    "sentencepiece>=0.1.99",
    "qwen-asr>=0.0.6",
    "PySide6>=6.7",
    "opencc-python-reimplemented>=0.1.7",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "resemblyzer>=0.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
]

[project.scripts]
japanese-subtitle-gui = "japanese_subtitle.app.gui:main"
japanese-subtitle-cli = "japanese_subtitle.app.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"src/japanese_subtitle/subtitles/ass.py" = ["E501"]
